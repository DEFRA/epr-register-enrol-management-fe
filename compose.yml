version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  # RA-739: single-node replica set, as in the root compose. management-be's
  # all-or-nothing submissions use multi-document transactions, which only
  # work on a replica set. The healthcheck initiates it on first run and is a
  # no-op afterwards. From the host, connect with directConnection=true.
  # The set name comes from a config file, not --replSet: the image's
  # entrypoint drops a config file's `replication` section (but not
  # --replSet) for the temporary mongod that runs the init scripts, so they
  # can still write before the set is initiated.
  mongodb:
    image: mongo:7.0.28
    command: ['--config', '/etc/mongod-replica-set.conf', '--bind_ip_all']
    configs:
      - source: mongod-replica-set
        target: /etc/mongod-replica-set.conf
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  ################################################################################

  case-management-frontend:
    build:
      context: ./
      target: development
    container_name: case-management-frontend
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
      - 'case-management-backend:case-management-backend'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      case-management-backend:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      # Local docker compose runs the dev profile: stub auth, placeholder
      # session cookie password, no Redis TLS. The hardening assertions in
      # src/config/config.js reject those defaults whenever NODE_ENV is
      # production, so keep this as development locally.
      NODE_ENV: development
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      BACKEND_API_URL: http://case-management-backend:8085
      # Placeholder id: shows the cookie banner, reports nowhere.
      ANALYTICS_ENABLED: true
      ANALYTICS_GTM_CONTAINER_ID: GTM-LOCAL0000
    networks:
      - cdp-tenant

  case-management-backend:
    build: ../epr-register-enrol-management-be
    container_name: case-management-backend
    ports:
      - '8085:8085'
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Mongo__DatabaseName: epr-register-case-management
    networks:
      - cdp-tenant

################################################################################

volumes:
  mongodb-data:

configs:
  # The mongodb service's replica set name (see its comment).
  mongod-replica-set:
    content: |
      replication:
        replSetName: rs0

networks:
  cdp-tenant:
    driver: bridge
