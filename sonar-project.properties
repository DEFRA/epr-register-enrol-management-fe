# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_epr-register-enrol-management-fe
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/epr-register-enrol-management-fe
sonar.links.ci=https://github.com/DEFRA/epr-register-enrol-management-fe/actions
sonar.links.scm=https://github.com/DEFRA/epr-register-enrol-management-fe
sonar.links.issue=https://github.com/DEFRA/epr-register-enrol-management-fe/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js

# RA-462: client-side progressive-enhancement scripts (src/client/**) are
# exercised by the WDIO journey suite (epr-register-enrol-mgmt-tests), not by
# unit tests — this repo has no jsdom setup. Excluded from vitest's own
# coverage run too (vitest.config.js); without this, new files under
# src/client/** report 0% here and fail the new-code coverage gate outright.
sonar.coverage.exclusions=src/client/**
